name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz"
          tar -xzf nvim.tar.gz
          echo "${GITHUB_WORKSPACE}/nvim-linux-x86_64/bin" >> "${GITHUB_PATH}"

      - name: Verify Neovim
        run: nvim --version

      - name: Run tests
        run: make test
